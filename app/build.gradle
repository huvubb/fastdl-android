plugins { id 'com.android.application' }

android {
    namespace 'com.fastdl.android'
    compileSdk 35
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId 'com.fastdl.android'
        minSdk 26
        targetSdk 35
        versionCode 19
        versionName '1.8.0'
    }

    buildTypes {
        release {
            // Keep the local debug signing key so test installs can upgrade
            // smoothly while this project is still in preview distribution.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
